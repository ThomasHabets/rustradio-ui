[workspace]

[package]
name = "iq-waterfall"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
console_error_panic_hook = "0.1.7"
log = "0.4.33"
rustradio = { version = "0.19.6", features = ["wasm", "unstable"] }
rustradio-ui = { path = "../..", features = ["unstable"] }
rustradio_macros = { version = "0.19" }
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = ["HtmlSelectElement", "Location", "Url", "Window"] }
