name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave blank for the next patch version)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          count=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$SHA" \
            --status success \
            --json databaseId \
            --jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "::error::No successful CI run for $SHA"
            exit 1
          fi
  release:
    needs: check-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - uses: dtolnay/rust-toolchain@stable

      - name: Install release tools
        run: cargo install --locked tickbox cargo-semver-checks

      - name: Release crate
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLEANUP=true tickbox --dir tickbox/bump_version --disable-tui --max-concurrency=1
